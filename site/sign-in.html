<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — WalkSpot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:ital,opsz,wght@1,7..72,500&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body data-page="sign-in">
  <header class="header"></header>

  <main class="sign-in">
    <img class="sign-in-photo" src="assets/images/hero.webp" width="2400" height="1350" alt="Two people walking down a forest path into golden sunlight" data-ru-alt="Двое идут по лесной дороге навстречу золотому свету">
    <div class="sign-in-form glass">
      <div>
        <h1 data-ru="С возвращением">Welcome back</h1>
        <p data-ru="Ваши прогулки, фото и записи о здоровье на большом экране.">Your walks, photos and health notes on a big screen.</p>
      </div>
      <a class="button button-ghost" href="walk.html">
        <svg viewBox="0 0 24 24"><path fill="#4285f4" d="M21.6 12.2c0-.7-.1-1.300-.2-1.900H12v3.700h5.400a4.600 4.600 0 0 1-2 3v2.500h3.200c1.900-1.700 3-4.300 3-7.300z"/><path fill="#34a853" d="M12 22c2.700 0 5-.9 6.600-2.400l-3.200-2.500c-.9.600-2 1-3.400 1-2.600 0-4.800-1.800-5.600-4.100H3.100v2.600A10 10 0 0 0 12 22z"/><path fill="#fbbc05" d="M6.400 14c-.2-.6-.3-1.300-.3-2s.1-1.400.3-2V7.400H3.100a10 10 0 0 0 0 9.200z"/><path fill="#ea4335" d="M12 5.900c1.500 0 2.800.5 3.800 1.500l2.900-2.900A10 10 0 0 0 3.100 7.400L6.400 10c.8-2.300 3-4.100 5.600-4.100z"/></svg>
        <span data-ru="Войти через Google">Continue with Google</span>
      </a>
      <p class="or" data-ru="или">or</p>
      <form class="entry">
        <label class="field"><svg class="icon"><use href="#mail"/></svg><input type="email" placeholder="Your email" data-ru-placeholder="Ваша почта" aria-label="Email"></label>
        <button class="button" type="button" data-ru="Прислать код">Send me a code</button>
        <p class="hint" data-ru="Пришлём код из шести цифр. Пароль не нужен.">We will email a six-digit code. No password needed.</p>
      </form>
      <div class="demo">
        <a class="link" href="walk.html"><span data-ru="Посмотреть демо">View demo</span><svg class="icon"><use href="#arrow"/></svg></a>
        <p class="hint" data-ru="Демо-аккаунт, в котором уже есть год прогулок. Только просмотр.">A sample account with a year of walks. View only.</p>
      </div>
    </div>
    <p class="voice" data-ru="Выходите в одном настроении.&#10;Возвращаетесь в другом, получше.">You set out in one mood.&#10;You come back in a better one.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
