<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walk — WalkPick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:ital,opsz,wght@1,7..72,500&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body data-page="walk">
  <header class="header"></header>

  <main class="app container">
    <div class="page-head">
      <div>
        <h1 data-ru="Прогулки">Walks</h1>
        <p id="today"></p>
      </div>
    </div>

    <section class="columns">
      <div class="map" id="map"></div>
      <div class="card" id="last-walk"></div>
    </section>

    <section class="period">
      <div class="page-head">
        <h2 id="period-title"></h2>
        <div class="segmented" id="period"></div>
      </div>
      <div class="columns columns-even">
        <div class="card">
          <dl class="stats" id="totals"></dl>
        </div>
        <div class="card">
          <div class="bars" id="bars"></div>
        </div>
      </div>
    </section>

    <div id="list"></div>

    <section class="card">
      <h3 data-ru="Год прогулок">A year of walks</h3>
      <div class="year-grid year-light" aria-hidden="true"></div>
      <p id="year-note"></p>
    </section>
  </main>

  <footer class="footer"></footer>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="live.js" data-then="app.js map.js walk.js"></script>
</body>
</html>
