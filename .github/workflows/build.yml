name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # An empty value still builds: the app runs and cannot reach the server.
      - name: Write local.properties
        run: |
          {
            echo "supabase.url=${{ secrets.SUPABASE_URL }}"
            echo "supabase.publishableKey=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
            echo "google.webClientId=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
          } > local.properties

      # One run configures the project once. The release build is the only one R8 touches:
      # a missing keep rule shows up here, not in the store.
      - name: Tests, static analysis, lint, debug and release builds
        run: ./gradlew testDebugUnitTest detekt lintDebug assembleDebug assembleRelease --no-daemon --continue

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge functions
        run: |
          deno lint supabase/functions
          deno check supabase/functions/*/index.ts

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            build/reports/detekt/
          retention-days: 7
          if-no-files-found: ignore

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Lint, tests, build
        run: |
          npm run lint
          npm test
          npm run test:e2e
          npm run build

      - name: Image
        run: docker build -t walkpick-api .

  # Cloud Build deploys the service on the same push; a migration must keep the old code working.
  migrate:
    needs: api
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Migrations
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
