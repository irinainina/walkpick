name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # An empty value still builds: the app runs and cannot reach the server.
      - name: Write local.properties
        run: |
          {
            echo "supabase.url=${{ secrets.SUPABASE_URL }}"
            echo "supabase.publishableKey=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
            echo "google.webClientId=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
          } > local.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Static analysis
        run: ./gradlew detekt --no-daemon

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Debug build
        run: ./gradlew assembleDebug --no-daemon

      # The only build R8 touches: a missing keep rule shows up here, not in the store.
      - name: Release build
        run: ./gradlew assembleRelease --no-daemon

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            build/reports/detekt/
          retention-days: 7
          if-no-files-found: ignore
